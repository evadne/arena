# Keep one Machine: lobbies and Phoenix PubSub are intentionally local to this node.
app = "evadne-arena"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  HOST = "evadne-arena.fly.dev"
  PORT = "4000"
  RELEASE_DISTRIBUTION = "none"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
