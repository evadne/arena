# Keep one Machine: lobbies and Phoenix PubSub are intentionally local to this node.
app = "evadne-arena"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  HOST = "evadne-arena.fly.dev"
  PORT = "4000"
  RELEASE_DISTRIBUTION = "none"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Open lobby WebSockets count as activity, including while players wait to deploy.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
